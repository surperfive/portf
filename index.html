<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>ZRH 作品集 · 2026</title>
<style>
  :root{
    --orange:#f27314;
    --bar-h:84px;
    --edge:24px;
    --bar-total:calc(var(--bar-h) + env(safe-area-inset-bottom, 0px));
  }
  @media (max-width:900px){ :root{ --bar-h:76px; --edge:14px; } }
  @media (max-width:600px){ :root{ --bar-h:72px; --edge:8px; } }

  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;background:#0b0b0b;color:#f4ebdd;overflow:hidden;
    font-family:'Source Han Sans SC','Microsoft YaHei',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;
  }

  /* ── 舞台：页面等比缩放居中 ───────────────────────── */
  #stage{
    position:fixed;left:0;right:0;top:0;bottom:var(--bar-total);
    display:flex;align-items:center;justify-content:center;
  }
  iframe{
    width:min(calc(100vw - var(--edge)*2),
              calc((100dvh - var(--bar-total) - var(--edge)*2) * 1.4131));
    height:min(calc(100dvh - var(--bar-total) - var(--edge)*2),
               calc((100vw - var(--edge)*2) / 1.4131));
    border:0;background:#111;box-shadow:0 0 0 1px #2a2a2a, 0 18px 50px rgba(0,0,0,.55);
    pointer-events:none;
  }
  @supports not (height: 100dvh){
    iframe{
      width:min(calc(100vw - var(--edge)*2),
                calc((100vh - var(--bar-total) - var(--edge)*2) * 1.4131));
      height:min(calc(100vh - var(--bar-total) - var(--edge)*2),
                 calc((100vw - var(--edge)*2) / 1.4131));
    }
  }

  /* 两侧点击翻页热区 */
  .zone{position:fixed;top:0;bottom:var(--bar-total);width:18%;cursor:pointer;z-index:2}
  #zl{left:0}
  #zr{right:0}
  @media (hover:none){ .zone{width:26%} }

  /* ── 底部控制条 ──────────────────────────────────── */
  #bar{
    position:fixed;left:0;right:0;bottom:0;height:var(--bar-total);
    padding:0 max(18px, env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px)
              max(18px, env(safe-area-inset-right,0px));
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
    background:rgba(17,17,17,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid #262626;z-index:5;
  }
  .side{display:flex;align-items:center;gap:14px;min-width:0}
  .side.right{justify-content:flex-end}

  #ttl{
    color:#e6ac47;font-size:12.5px;letter-spacing:.1em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #hint{color:#5f574c;font-size:11px;white-space:nowrap}
  @media (max-width:1000px){ #hint{display:none} }
  @media (max-width:720px){ #ttl{display:none} }
  #brand{display:none;color:#6b6357;font-size:11px;letter-spacing:.24em}
  @media (max-width:720px){ #brand{display:inline} }

  .center{display:flex;align-items:center;gap:clamp(10px,1.6vw,18px);justify-self:center}

  .nav{
    width:clamp(52px,5.8vw,64px);height:clamp(48px,5.2vw,56px);
    display:grid;place-items:center;padding:0;
    background:#151515;border:1px solid #3a3a3a;border-radius:9px;
    color:#f4ebdd;font-size:clamp(24px,2.9vw,30px);line-height:1;
    cursor:pointer;touch-action:manipulation;
    transition:border-color .16s,color .16s,background .16s,transform .08s;
  }
  .nav:hover{border-color:var(--orange);color:var(--orange);background:#1b1b1b}
  .nav:active{transform:translateY(1px)}
  .nav[disabled]{opacity:.3;cursor:default;border-color:#2a2a2a;color:#6b6357}

  #idx{
    display:flex;align-items:baseline;gap:6px;justify-content:center;
    font-family:Consolas,ui-monospace,monospace;letter-spacing:.04em;
    min-width:clamp(104px,10vw,140px);
  }
  #cur{color:var(--orange);font-size:clamp(21px,2.3vw,26px);font-weight:600}
  #idx i{color:#4a4a4a;font-style:normal;font-size:15px}
  #tot{color:#8a7b68;font-size:clamp(14px,1.6vw,17px)}

  #tocbtn{
    display:flex;align-items:center;gap:6px;height:clamp(42px,4.6vw,46px);padding:0 18px;
    background:#151515;border:1px solid #3a3a3a;border-radius:9px;color:#cfc8bb;
    font-size:12px;letter-spacing:.06em;cursor:pointer;touch-action:manipulation;
    transition:border-color .16s,color .16s;
  }
  #tocbtn:hover{border-color:var(--orange);color:var(--orange)}
  @media (max-width:520px){ #tocbtn span{display:none} #tocbtn{padding:0 12px} }

  /* ── 目录浮层 ────────────────────────────────────── */
  #jump{
    position:fixed;inset:0 0 var(--bar-total) 0;z-index:8;overflow:auto;
    background:rgba(10,10,10,.96);backdrop-filter:blur(8px);
    display:none;padding:clamp(16px,3vw,34px);
  }
  #jump.on{display:block}
  #jumpgrid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(132px,20vw,168px),1fr));
    gap:clamp(8px,1.2vw,12px);max-width:1240px;margin:0 auto;
  }
  .cell{
    border:1px solid #2c2c2c;border-radius:6px;padding:clamp(10px,1.4vw,14px) 12px;
    cursor:pointer;font-size:clamp(11px,1.3vw,12.5px);color:#cfc8bb;line-height:1.45;
    min-height:64px;transition:border-color .16s,color .16s,background .16s;
  }
  .cell:hover{border-color:var(--orange);color:#f4ebdd;background:#141414}
  .cell.on{border-color:var(--orange);background:rgba(242,115,20,.10);color:#f4ebdd}
  .cell b{display:block;color:#e6ac47;font-family:Consolas,monospace;font-size:clamp(14px,1.7vw,16px);margin-bottom:5px}

  /* 网址点击热区（覆盖在页面右上角的网址文字上） */
  #urllink{
    position:fixed;display:none;z-index:4;border-radius:4px;
    text-decoration:none;cursor:pointer;
    transition:background .16s, box-shadow .16s;
  }
  /* 悬停高亮只在有指针的设备上出现，避免手机上点一下留个大框 */
  @media (hover:hover) and (pointer:fine){
    #urllink:hover,#urllink:focus-visible{
      background:rgba(242,115,20,.12);
      box-shadow:inset 0 0 0 1px rgba(242,115,20,.45);
      outline:none;
    }
    #urllink:active{background:rgba(242,115,20,.18)}
  }

  /* 超窄屏（≤400px）再收一档，保证控制条不挤 */
  @media (max-width:400px){
    #bar{gap:8px;padding-left:10px;padding-right:10px}
    .center{gap:8px}
    .nav{width:46px;height:46px;font-size:22px;border-radius:8px}
    #idx{min-width:88px;gap:4px}
    #cur{font-size:18px}
    #tot{font-size:12px}
    #idx i{font-size:12px}
    #brand{display:none}
    #tocbtn{padding:0 11px;height:38px}
  }

  /* 竖屏提示：只在手机竖屏出现，几秒后淡出 */
  #rotate{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(var(--bar-total) + 12px);
    padding:6px 14px;border-radius:999px;
    background:rgba(242,115,20,.12);border:1px solid rgba(242,115,20,.35);
    color:#e6ac47;font-size:11px;letter-spacing:.06em;white-space:nowrap;
    pointer-events:none;opacity:0;z-index:6;
  }
  @media (orientation:portrait) and (max-width:820px){
    #rotate{animation:rotIn .5s .8s forwards, rotOut .8s 6s forwards}
  }
  @keyframes rotIn{to{opacity:1}}
  @keyframes rotOut{to{opacity:0}}

  /* ── 加载页：深底 + 脉动渐变线 + PORTFOLIO/LOADING ─────────
     首屏由 HTML 直接渲染，不等 JS；每翻一页重新盖住，等页面内
     图片/视频真正就绪后再淡出 */
  @font-face{
    font-family:'ZRH_Boot';
    src:url('data:font/woff2;base64,d09GMgABAAAAAAc4AA4AAAAAEigAAAbkAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAABmAAPAgmCYs7ERAKjmiKOgE2AiQDcAs6AAQgBYJIByAMgTQbzA4ojpSuEpJkkw/hpv/uAhQuJJlQsSTARIUyc0qQaSi1qdM5MhXaqdBpvrpCAH8/b1VAnQSNUTgd4PjTDAthIPP382tu8d4O1yha2uywBqFSCv/2kTcxB5KYhEaik72JWCZBIxFChpc5S9UYR4xQsfdeAC7xEtkFM5A/+RUwiBA4au5/oDELuFjNoD7xpsC+bDiGUAUSwexibOdCeNKzmPzoUYMKjqcADuDAISTbpA1YHATVMYaspHNoGs1+lH1oN6eZYzl6Dq9x/JJYImb9/jAKoFmAfgED6LAwYN/6GwnZoRkku9mAp3oX7Ljr9I4GyERVy6o8GTKzowE6MUBGzpzhHuzNcC29k/1uTU2oiVF6QvWqlbP0jKnkCTG/K5LQOqsZTNlVqRlM3TkzQ7TiaUxE0/p1NGBSY026hAZmtVqHrSY5/uf6IfNkjJrhWk30T/JnYp7izBCPVux0qmWZByf6UZen2KlpndZyXkLca6sKTg45essoV1m1cEpJcpeWSHA6txOGJBLFCbc2bGgQFPFDjAbi9OdalhkkNtGhMwaK4kzndtYXacVOzdPRgG0yZoq/zJMkOzVk79w4rPFWMR7sLF/3goCzyF2SoQk0FTZJbMYMEYOk2N/Cw4s35+AQy4U8Nrfu8wWcC7gXylAExcKi/1qSiJdykMUUUFml7p0Czi7ubhlaQEthi//aKhFt7QfAjddRBUjIggMAJRj6dLmADkrTE3WGCVLBVgRFungqgfysLFfIWIHISpq1tJtEXhTsBU1yhZImhUIHa2GOYLfxNWHms09lM/x8oCb51H2NQOzQecc+x5m2F4BY5t4nmd1clbxESN1Fmono42ZE50EfF3gB9ujp+68Tru7GA89wNJaayu3TqFABx4sQ9XqE5uVFF1ecmQ1Y7qvgd3QzIpxltozP7fTG8lE85TnexGYgU43JX0HknWb+KBrk9QgLUDbDFJVuTcx6LRhi4PydwRyM5MzjtYJuMesachlGe2BqerTN5WCXABaaoCuW6nn0tmZdWTemeeDoPofGAowqq30lC/6XyGZt7LYT4VPoaTXkIyYUiQR7kpXfurWm+/GUivsur2TVfHjGc5AmK8QCR0+fMa2c92vMN5UFA+YjdMq4ivki4aOa36OXLt/9e32qz+Gc3odTf9Q3OffQTDOeMGTvcl2ZJ13yvLY4thjTGosUfdkI+eaxQ4NFt7gRfaL4hOAUXdI6ySWKD+OhkOSSTgpuaVOoQfFGl8grlCVRr9IQwrsGm6osf/BT6WTwM7fQXTgpdRPwYEjsJp2Mh+OnKhTD+Z0JFOvLvbJ97CnldOm1eCjuSDJFj/rkc2g4NOm+F1Ef466QJyubXG7ZtylhHvFU6JrQTTqJ9Nj/u6bSKel/Cedg8Mtx3WD6X67YQz9JbkFF81ey008dz7CxbMKZn7p0TaLBUAW3+H3IJvuiusLwtVGzo3bHG+nUe9XxwzWJ95Np1P/8BhzrIqkvb91MpdNo3t3b0Fl5McMKeQ9l5zP1fzIlucS/xXch5DC3gIbnb8SpTV46KPOCih6TI8t0lhr3ZOkjfRP6y8fN0bd6hdGkSMWjChKpRFL2bonIT6bEbsLfkks8EfCQv4VuEn7tundDnbh/na2RxYkNHhP1yXmyb7mu1Cr68rH/St3ED2GUQcXuIl4KY1xSKukhlBVn7v1g8IzkFnd1HyNKecUSZayypKJcORuG40zCO8Nk2HacLVRGdKNlMeUW3dJPEtanRIUPjFBa49+7S+qvltbv/qTg4wI03L3u2epnt1U+243cbtQf0zOzM2lyEV66e8ujWx898Ubf3/QTp39YfvGJX/XX++Ly3RkxIx7m6kpT     font-weight:400;font-style:normal;font-display:swap;
  }
  #boot{
    position:fixed;inset:0;z-index:30;background:#111;
    transition:none;               /* 盖上时瞬间生效，别透出底下的内容 */
  }
  #boot::before{                 /* 顶部柔光 + 1px 内描边 */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(240,231,214,.045),rgba(240,231,214,0)) 0 0/100% 42% no-repeat;
    box-shadow:
      inset 0 0 0 1px rgba(240,231,214,.12),
      inset 0 clamp(30px,5vw,78px) clamp(72px,12vw,150px) rgba(255,247,235,.035);
  }
  #boot .btxt{
    position:absolute;left:50%;top:50%;width:min(68vw,420px);
    transform:translate3d(-50%,-50%,0);
    color:#f4ebdd;white-space:pre;text-align:center;
    font-family:'ZRH_Boot','Source Han Sans SC','Microsoft YaHei',system-ui,sans-serif;
    font-size:clamp(18px,2.1vw,34px);line-height:1.55;letter-spacing:.18em;
    text-shadow:0 0 18px rgba(244,235,221,.12);opacity:.94;
    animation:bootBreathe 1.45s cubic-bezier(.42,0,.2,1) infinite;
  }
  #boot .bline{
    position:absolute;left:50%;top:calc(50% + clamp(58px,6vw,82px));
    transform:translate(-50%,-50%);
    height:2px;width:clamp(120px,18vw,260px);
    background:linear-gradient(90deg,
      rgba(221,55,55,0) 0%,#dd3737 18%,#e6ac47 52%,#8ac0b1 84%,rgba(138,192,177,0) 100%);
    animation:bootLine 1.45s cubic-bezier(.42,0,.2,1) infinite;
  }
  @keyframes bootLine{
    0%,100%{width:clamp(120px,18vw,260px);filter:brightness(.92)}
    50%    {width:clamp(170px,24vw,360px);filter:brightness(1.08)}
  }
  @keyframes bootBreathe{0%,100%{opacity:.78}50%{opacity:1}}
  @media (max-width:760px){
    #boot .btxt{width:min(76vw,320px);font-size:clamp(17px,5vw,26px)}
  }
  #boot.off{
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .42s ease,visibility .42s;   /* 只有淡出带动画 */
  }
  @media (prefers-reduced-motion:reduce){
    #boot .bline,#boot .btxt{animation:none}
  }

<body>
<div id="boot" role="status" aria-label="作品集加载中">
  <div class="btxt">PORTFOLIO
LOADING</div>
  <div class="bline"></div>
</div>

<div id="stage">
  <iframe id="fr" title="作品集页面" tabindex="-1"></iframe>
  <div class="zone" id="zl" aria-hidden="true"></div>
  <div class="zone" id="zr" aria-hidden="true"></div>
</div>

<a id="urllink" href="https://greenbite-lite-meal.pages.dev/" target="_blank" rel="noopener"
   title="打开 greenbite-lite-meal.pages.dev"
   aria-label="打开小程序网址 greenbite-lite-meal.pages.dev"></a>

<div id="rotate">横屏观看更清晰 · 左右滑动翻页</div>

<div id="jump"><div id="jumpgrid"></div></div>

<div id="bar">
  <div class="side left"><span id="brand">ZRH</span><span id="ttl"></span></div>
  <div class="center">
    <button class="nav" id="prev" aria-label="上一页">‹</button>
    <span id="idx"><b id="cur">01</b><i>/</i><span id="tot">36</span></span>
    <button class="nav" id="next" aria-label="下一页">›</button>
  </div>
  <div class="side right">
    <span id="hint">← → 翻页 · G 目录 · 点两侧也可翻</span>
    <button id="tocbtn" aria-label="打开目录"><span>目录</span>☰</button>
  </div>
</div>

<script>
const P=[{f:"01-cover-01-01.svg",n:"01",t:"封面"},
{f:"01-cover-01-02.svg",n:"02",t:"目录"},
{f:"01-cover-01-02a.svg",n:"03",t:"提示词生成草稿图 上"},
{f:"01-cover-01-02b.svg",n:"04",t:"提示词生成草稿图 下"},
{f:"01-cover-01-02c.svg",n:"05",t:"AI重绘生图"},
{f:"01-cover-01-02d.svg",n:"06",t:"小程序草稿转绘"},
{f:"01-cover-01-02e.svg",n:"07",t:"品牌IP + LOGO"},
{f:"01-cover-01-02f.svg",n:"08",t:"内部图标"},
{f:"01-cover-01-02g.svg",n:"09",t:"内部图片 ①"},
{f:"01-cover-01-02h.svg",n:"10",t:"内部图片 ②"},
{f:"01-cover-01-02r.svg",n:"11",t:"规范小程序内部图片"},
{f:"01-cover-01-02i.svg",n:"12",t:"动效 ①"},
{f:"01-cover-01-02j.svg",n:"13",t:"动效 ②"},
{f:"01-cover-01-02k.svg",n:"14",t:"细节优化"},
{f:"01-cover-01-02l.svg",n:"15",t:"UI规范"},
{f:"01-cover-01-02t.svg",n:"16",t:"效果展示 · 六屏总览"},
{f:"01-cover-01-02m.svg",n:"17",t:"品牌物料延展"},
{f:"01-cover-01-02n.svg",n:"18",t:"IP延展 ② · 表情包"},
{f:"01-cover-01-02q.svg",n:"19",t:"AI视频素材 ①"},
{f:"01-cover-01-02s.svg",n:"20",t:"AI视频素材 ②"},
{f:"01-cover-01-02o.svg",n:"21",t:"AI短剧视频"},
{f:"01-cover-01-02p.svg",n:"22",t:"AI电商视频"},
{f:"01-cover-01-03.svg",n:"23",t:"AIGC 辅助生图"},
{f:"01-cover-01-04.svg",n:"24",t:""},
{f:"01-cover-01-05.svg",n:"25",t:""},
{f:"01-cover-01-06.svg",n:"26",t:""},
{f:"01-cover-01-07.svg",n:"27",t:""},
{f:"01-cover-01-09.svg",n:"28",t:""},
{f:"01-cover-01-11.svg",n:"29",t:""},
{f:"01-cover-01-12.svg",n:"30",t:""},
{f:"01-cover-01-13.svg",n:"31",t:"实战落地"},
{f:"01-cover-01-15.svg",n:"32",t:""},
{f:"01-cover-01-17.svg",n:"33",t:""},
{f:"01-cover-01-18.svg",n:"34",t:"LORA 训练"},
{f:"01-cover-01-19.svg",n:"35",t:""},
{f:"01-cover-01-21.svg",n:"36",t:""}];

let i=0;
const fr=document.getElementById('fr'),
      cur=document.getElementById('cur'),
      tot=document.getElementById('tot'),
      ttl=document.getElementById('ttl'),
      jump=document.getElementById('jump'),
      grid=document.getElementById('jumpgrid'),
      prev=document.getElementById('prev'),
      next=document.getElementById('next');
const KEY='zrh_pg', WN='zrh_pg:';

/* ── 加载页：盖住整屏，等这一页的图/视频真的就绪再淡出 ───────── */
const boot=document.getElementById('boot');
let seq=0;                       // 每次翻页自增，避免上一页的回调误关加载页
let readySeq=-1;                 // 已经就绪的那一页，防止迟到的 bootOn 把加载页又盖回来
let showT=null, hideT=null, watchT=null;
let bootShownAt=performance.now();
let firstPage=true;

function bootOn(my){
  if(my!==seq || my===readySeq) return;   // 这一页已经加载完，别再盖上来
  clearTimeout(hideT); hideT=null;
  boot.classList.remove('off');
  bootShownAt=performance.now();
}
function bootOff(my){
  if(my!==seq) return;
  readySeq=my;
  clearTimeout(hideT); clearTimeout(watchT);
  const left=Math.max(0,300-(performance.now()-bootShownAt));   // 至少显示 300ms，别一闪而过
  hideT=setTimeout(function(){ boot.classList.add('off'); }, left);
}
// SVG 里的 image 都是 data URI，解析时已解码；真正耗时的是内嵌 mp4
function pageReady(doc){
  try{
    const vs=doc.querySelectorAll('video');
    for(let k=0;k<vs.length;k++){
      const v=vs[k];
      if(v.error) continue;             // 出错就别一直卡着
      if(v.readyState<2) return false;  // 还没到 HAVE_CURRENT_DATA
    }
  }catch(e){}
  return true;
}
function waitPage(my){
  let doc=null;
  try{doc=fr.contentDocument;}catch(e){}
  let waited=0;
  (function tick(){
    if(my!==seq) return;
    if(waited>=12000 || !doc || pageReady(doc)){
      // 等两帧，确保新页面真的画出来了再收加载页
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ bootOff(my); });
      });
      return;
    }
    waited+=80;
    setTimeout(tick,80);
  })();
}

function save(k){
  // 三重备份：预览面板重载 iframe 时，localStorage 可能被沙箱屏蔽，window.name 还能撑住
  try{localStorage.setItem(KEY,k);}catch(e){}
  try{sessionStorage.setItem(KEY,k);}catch(e){}
  try{window.name=WN+k;}catch(e){}
}
function load(){
  let v=null;
  try{v=localStorage.getItem(KEY);}catch(e){}
  if(v===null){try{v=sessionStorage.getItem(KEY);}catch(e){}}
  if(v===null){try{if(String(window.name).indexOf(WN)===0)v=window.name.slice(WN.length);}catch(e){}}
  const n=v===null?null:parseInt(v,10);
  return (n!==null&&!isNaN(n)&&n>=0&&n<P.length)?n:null;
}

function go(k){
  i=Math.max(0,Math.min(P.length-1,k));
  const my=++seq;
  clearTimeout(showT);

  if(firstPage){
    // 首屏的加载页由 HTML 直接渲染，这里只重置计时
    bootShownAt=performance.now();
    boot.classList.remove('off');
    firstPage=false;
  }else{
    // 快的页面不闪；超过 140ms 还没就绪才把加载页盖上来
    showT=setTimeout(function(){ bootOn(my); },140);
  }

  fr.src=encodeURI(P[i].f);
  // 兜底：网络卡死导致 iframe 的 load 一直不来，40s 后也强制收掉，别让人一直盯着加载页
  clearTimeout(watchT);
  watchT=setTimeout(function(){ if(my===seq) bootOff(my); },40000);
  cur.textContent=String(i+1).padStart(2,'0');
  tot.textContent=P.length;
  ttl.textContent=P[i].t||'';
  prev.disabled=(i===0);
  next.disabled=(i===P.length-1);
  save(i);

  // 目录页要接收页面内的点击，所以放开 iframe 的 pointer-events 并暂时收起两侧翻页热区
  const toc=(P[i].f==='01-cover-01-02.svg');
  fr.style.pointerEvents=toc?'auto':'none';
  document.getElementById('zl').style.display=toc?'none':'';
  document.getElementById('zr').style.display=toc?'none':'';

  placeUrl();

  const cells=grid.children;
  for(let c=0;c<cells.length;c++){cells[c].classList.toggle('on',c===i);}
}

// 含网址块的页面：在页面右上角叠一个透明链接（SVG 里是文字，iframe 本身不吃点击）
const URL_PAGES=/^01-cover-01-02(a|b|c|d|e|f|g|h|i|j|k|l|m|n|r|t)\.svg$/;
const URL_BOX={x:843,y:144,w:247,h:21};   // 兜底值：1122×794 用户坐标（file:// 读不到内文档时用）
const urlLink=document.getElementById('urllink');

// 量取 SVG 里那行网址文字的真实渲染框；量不到就按 1122×794 比例换算兜底值
function urlBoxInFrame(){
  try{
    const doc=fr.contentDocument;
    if(doc){
      const list=doc.querySelectorAll('text');
      for(let k=0;k<list.length;k++){
        if((list[k].textContent||'').indexOf('greenbite')>=0){
          const b=list[k].getBoundingClientRect();
          if(b.width>4&&b.height>2){
            return {x:b.left-5,y:b.top-4,w:b.width+10,h:b.height+8};
          }
        }
      }
    }
  }catch(e){}
  const r=fr.getBoundingClientRect();
  const sx=r.width/1122, sy=r.height/794;
  return {x:URL_BOX.x*sx,y:URL_BOX.y*sy,w:URL_BOX.w*sx,h:URL_BOX.h*sy};
}

function placeUrl(){
  if(!URL_PAGES.test(P[i].f)){urlLink.style.display='none';return;}
  const r=fr.getBoundingClientRect();
  if(!r.width){urlLink.style.display='none';return;}
  const b=urlBoxInFrame();
  // 文字在手机上会缩到 5px 高，触摸点不中；按最小可点击尺寸从中心外扩
  const coarse=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
  const minH=coarse?44:30;
  if(b.h<minH){b.y-=(minH-b.h)/2;b.h=minH;}
  const minW=140;
  if(b.w<minW){b.x-=(minW-b.w)/2;b.w=minW;}
  // 换到视口坐标后再夹住，避免可点区域越出屏幕被裁掉
  let ax=r.left+b.x, ay=r.top+b.y;
  const vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
  if(ax<4)ax=4;
  if(ay<4)ay=4;
  if(ax+b.w>vw-4)ax=vw-4-b.w;
  if(ay+b.h>vh-4)ay=vh-4-b.h;
  urlLink.style.display='block';
  urlLink.style.left=ax+'px';
  urlLink.style.top=ay+'px';
  urlLink.style.width=b.w+'px';
  urlLink.style.height=b.h+'px';
}
window.addEventListener('resize',placeUrl);

// 目录页内点击某一行 → 跳到对应页
window.addEventListener('message',function(e){
  if(e.origin!==location.origin)return;
  const d=e.data;
  if(d&&d.zrh==='goto'&&typeof d.p==='number'){go(d.p+1);}
});

prev.onclick=function(){go(i-1);};
next.onclick=function(){go(i+1);};
document.getElementById('zl').onclick=function(){go(i-1);};
document.getElementById('zr').onclick=function(){go(i+1);};
document.getElementById('tocbtn').onclick=function(){jump.classList.toggle('on');};

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
  else if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1);}
  else if(e.key==='g'||e.key==='G'){jump.classList.toggle('on');}
  else if(e.key==='Escape'){jump.classList.remove('on');}
});

P.forEach(function(p,k){
  const d=document.createElement('div');
  d.className='cell';
  d.innerHTML='<b>'+p.n+'</b>'+(p.t||'—');
  d.onclick=function(){jump.classList.remove('on');go(k);};
  grid.appendChild(d);
});

// 触摸滑动翻页（挂到 iframe 内部，同源可直接监听）
function bindSwipe(doc){
  if(!doc||doc.__zrhSwipe)return;
  doc.__zrhSwipe=true;
  let sx=0,sy=0,active=false;
  doc.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;active=true;
  },{passive:true});
  doc.addEventListener('touchend',function(e){
    if(!active)return;active=false;
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*1.4){go(i+(dx<0?1:-1));}
  },{passive:true});
}
fr.addEventListener('load',function(){
  const my=seq;
  try{bindSwipe(fr.contentDocument);}catch(e){}
  placeUrl();
  waitPage(my);
});

// 视口变化时（手机横竖屏切换）重新布局
let rz=null;
window.addEventListener('resize',function(){
  clearTimeout(rz);
  rz=setTimeout(function(){document.body.style.height=window.innerHeight+'px';},120);
});

let start=0;
try{
  const h=parseInt((location.hash||'').slice(1),10);
  if(h>0&&h<=P.length){start=h-1;}
  else{const s=load();if(s!==null){start=s;}}
}catch(e){}
go(start);
</script>
</body>
</html>
